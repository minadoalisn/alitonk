name: Weekly Quality-Gated GEO Promotion

# Paused on 2026-10-19 at the owner's request; daily operations are separate.
# Do not restore scheduled publishing without renewed owner approval.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    # Keep manual dispatch from publishing while this legacy workflow is paused.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GEO/SEO research dependencies
        run: python -m pip install -r scripts/requirements-geo-seo.txt

      - name: Test and build static site
        run: npm test && npm run build

      - name: Run GEO/SEO research
        run: npm run geo:seo:research

      - name: Run GEO health audit
        run: npm run geo:audit

      - name: Run observable GEO learning loop
        run: npm run geo:learn

      - name: Generate promotion article
        run: npm run blog:promotion
        env:
          BLOG_BASE_URL: https://minadoai.com

      - name: Validate generated output and refresh learning state
        run: npm run build && npm run geo:learn && npm run validate

      - name: Commit qualified content and latest reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A memory/research/geo-audit memory/research/geo-learning memory/research/geo-seo public/blog/briefings public/feed.xml public/sitemap.xml
          git diff --cached --quiet || git commit -m "Publish qualified weekly GEO briefing"
          git push
