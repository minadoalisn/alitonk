<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ALI Charity</title>
    <meta name="description" content="ALI Charity admin login page">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #0b1120;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            padding: 20px;
        }
        .container {
            background: #111827;
            border: 1px solid #263247;
            border-radius: 8px;
            padding: 34px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        }
        h1 { font-size: 1.7rem; margin-bottom: 8px; }
        .subtitle { color: #9aa8bd; margin-bottom: 26px; line-height: 1.5; }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 700;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #f8fafc;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #38bdf8; }
        button {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid rgba(34, 197, 94, 0.35);
            border-radius: 8px;
            background: rgba(34, 197, 94, 0.16);
            color: #bbf7d0;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        .error, .success {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            font-size: 14px;
        }
        .error { color: #fecdd3; background: rgba(251, 113, 133, 0.12); border: 1px solid rgba(251, 113, 133, 0.28); }
        .success { color: #bbf7d0; background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.28); }
        .footer { text-align: center; margin-top: 20px; color: #94a3b8; font-size: 14px; }
        .footer a { color: #38bdf8; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ALI Charity Admin</h1>
        <p class="subtitle">Secure operations login for donation review, public data monitoring, and audit checks.</p>
        
        <form id="loginForm">
            <div class="error" id="errorMessage"></div>
            <div class="success" id="successMessage"></div>
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
            
            <button type="submit">Login</button>
        </form>
        
        <div class="footer">
            <p><a href="/">Back to Home</a></p>
            <p>2026 ALI Charity</p>
        </div>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('errorMessage');
        const successEl = document.getElementById('successMessage');
        const button = form.querySelector('button[type="submit"]');
        
        errorEl.style.display = 'none';
        successEl.style.display = 'none';
        button.disabled = true;
        button.textContent = 'Signing in...';
        
        try {
            const response = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();
            if (!response.ok || !data.ok) {
                throw new Error(data.error || 'Invalid username or password');
            }
            successEl.style.display = 'block';
            successEl.textContent = 'Login successful. Redirecting...';
            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 600);
        } catch (error) {
            errorEl.style.display = 'block';
            errorEl.textContent = error.message;
            button.disabled = false;
            button.textContent = 'Login';
        }
    });
    </script>
</body>
</html>
