    <circle cx="150" cy="150" r="108" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10"/>
    <path d="M105 162c0 35 28 62 63 62 30 0 55-20 61-48h-34c-5 12-16 20-29 20-18 0-32-15-32-34 0-19 14-34 32-34 13 0 24 8 29 20h34c-6-28-31-48-61-48-35 0-63 28-63 62z" fill="#2b1a00" opacity="0.85"/>
    <text x="150" y="286" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#ffffff" opacity="0.85">STABLECOIN</text>
  </g>

  <g transform="translate(540 200)">
    <path d="M40 190c58-116 168-178 292-166 88 8 160 51 210 121" fill="none" stroke="#7fe3ff" stroke-opacity="0.55" stroke-width="10"/>
    <path d="M70 222c78-89 188-128 310-108 84 13 150 54 198 123" fill="none" stroke="#61ffd2" stroke-opacity="0.45" stroke-width="8"/>
    <path d="M95 255c84-62 192-81 306-54 74 18 132 56 170 114" fill="none" stroke="#b18bff" stroke-opacity="0.40" stroke-width="6"/>
    <circle cx="38" cy="190" r="10" fill="#7fe3ff" opacity="0.85"/>
    <circle cx="68" cy="222" r="9" fill="#61ffd2" opacity="0.85"/>
    <circle cx="93" cy="255" r="8" fill="#b18bff" opacity="0.85"/>
