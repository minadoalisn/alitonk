<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="ALI Charity illustration: stablecoin aid policy signals and transparent giving">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="1" stop-color="#0f3d5c"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd35a"/>
      <stop offset="1" stop-color="#ff9d2e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
